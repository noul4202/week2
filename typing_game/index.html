<html>
    <head>
        <title>Typing game</title>
            <link rel="stylesheet" href="style.css">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
        </head>
    <body>
        <h1>
            <i class="fa-solid fa-keyboard"></i>
            <span class="orange">Typing</span> game!
        </h1>
        <p class="white">Practice your typing skills with a quote from Sherlock Holmes. Click **start** to begin!</p>
        
        <p id="quote"></p>
        
        <p id="message"></p>
        <div>
            <input type="text" aria-label="current word" id="typed-value" />
            <button type="button" id="start">Start</button>
        </div>
        <div id="modal-container" class="hidden">
            <div id="modal">
                <h2>Good job</h2>
                <p id="modal-best-score"></p>
                <p id="modal-current-score"></p>
                <button type="button" id="modal-close-button">close</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
